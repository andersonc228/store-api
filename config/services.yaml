parameters:
  jwt.token.ttl: 86400

services:
  _defaults:
    autowire: true
    autoconfigure: true
    bind:
      $commandBus: '@App\Shared\Application\Bus\CommandBus'
      $queryBus: '@App\Shared\Application\Bus\QueryBus'
      $eventBus: '@App\Shared\Application\Bus\EventBus'
      $tokenExpirationSeconds: '%jwt.token.ttl%'

  App\:
    resource: '../src/'
    exclude:
      - '../src/Kernel.php'

  App\Api\Ui\Http\:
    resource: '../src/Api/Ui/Http/'
    tags:
      - controller.service_arguments

  App\Shared\Infrastructure\Symfony\Messenger\WorkerFailedLogSubscriber:
    arguments:
      $exceptionLogTransformers: !tagged_iterator App\Shared\Infrastructure\Logging\ExceptionLogTransformer

  App\Api\Infrastructure\Kernel\ExceptionSubscriber:
    arguments:
      $exceptionTransformers: !tagged_iterator App\Api\Ui\Kernel\ExceptionTransformer\ExceptionTransformer
      $exceptionLogTransformers: !tagged_iterator App\Shared\Infrastructure\Logging\ExceptionLogTransformer

  App\Api\Infrastructure\Kernel\ExceptionLogTransformer\ConfigExceptionLogTransformer:
    arguments:
      $mapping: []

  _instanceof:
    App\Shared\Application\Bus\CommandHandler:
      tags:
        - { name: 'messenger.message_handler', bus: 'command.bus' }
    App\Shared\Application\Bus\QueryHandler:
      tags:
        - { name: 'messenger.message_handler', bus: 'query.bus' }
    App\Shared\Application\Bus\EventHandler:
      tags:
        - { name: 'messenger.message_handler', bus: 'event.bus' }
    App\Api\Ui\Kernel\ExceptionTransformer\ExceptionTransformer:
      tags:
        - { name: 'App\Api\Ui\Kernel\ExceptionTransformer\ExceptionTransformer' }
    App\Shared\Infrastructure\Logging\ExceptionLogTransformer:
      tags:
        - { name: 'App\Shared\Infrastructure\Logging\ExceptionLogTransformer' }
