lexik_jwt_authentication:
  secret_key: '%env(resolve:JWT_SECRET_KEY)%'
  public_key: '%env(resolve:JWT_PUBLIC_KEY)%'
  pass_phrase: '%env(resolve:JWT_PASSPHRASE)%'

  # Tiempo de vida por defecto (en segundos)
  token_ttl: 3600

  # Configuración de los extractores automáticos
  token_extractors:
    authorization_header:
      enabled: true
      prefix:  Bearer
      name:    Authorization

    cookie:
      enabled: true
      name:    BEARER

    query_parameter:
      enabled: true
      name:    token
