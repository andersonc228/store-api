doctrine:
    dbal:
        url: '%env(resolve:DATABASE_URL)%'
    orm:
        validate_xml_mapping: true
        naming_strategy: doctrine.orm.naming_strategy.underscore_number_aware
        auto_mapping: true
        mappings:
          User:
            type: 'xml'
            dir: '%kernel.project_dir%/src/User/Infrastructure/Persistence/Mapping'
            prefix: 'App\User\Domain\Model'
            alias: User
        controller_resolver:
            auto_mapping: false

